name: Next.js Deploy (shared)

on:
  workflow_call:
    inputs:
      app_path:
        description: "Server path, e.g. /var/www/nextjs-apps/showkini-frontend"
        required: true
        type: string
      pm2_name:
        required: true
        type: string
      branch:
        required: false
        type: string
        default: main
      use_prisma:
        required: false
        type: boolean
        default: false
      standalone:
        description: "true if PM2 runs .next/standalone/server.js"
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd "${{ inputs.app_path }}"
            echo "▶ Deploying $(pwd) from branch ${{ inputs.branch }}"

            # --ff-only: stops safely if the server has local changes or diverged history
            git pull --ff-only origin "${{ inputs.branch }}"

            if [ -f package-lock.json ]; then npm ci; else npm install; fi

            if [ "${{ inputs.use_prisma }}" = "true" ]; then
              npx prisma generate
              npx prisma migrate deploy
            fi

            npm run build

            if [ "${{ inputs.standalone }}" = "true" ]; then
              # Standalone output does not include static files or public/ — copy them in
              mkdir -p .next/standalone/.next
              cp -r .next/static .next/standalone/.next/
              [ -d public ] && cp -r public .next/standalone/
              for f in .env .env.production .env.local; do
                [ -f "$f" ] && cp "$f" .next/standalone/
              done
            fi

            pm2 reload "${{ inputs.pm2_name }}"
            pm2 save

            echo "✅ Deployed: $(git log -1 --oneline)"
